[package]
name = "akgine"
version = "0.1.5"
edition = "2024"
description = "Global function"
license = "GPL-3.0-only"
repository = "https://github.com/Arflaka/akgine"

[lib]
name = "akgine"
crate-type = ["cdylib", "rlib"] # required for Android .so

[lints.rust]
unused_parens = "allow"

[dependencies]
akgine_macros = { path = "./akgine_macros", version = "0.1.2", optional = true }
# akgine_macros = { path = "./akgine_macros" }
egui_extras = { version = "0.36.2", features = ["image"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[features]
default = []                            # Aucune feature n'est activée par défaut
derive = ["dep:akgine_macros"]
gui = ["dep:egui_extras", "dep:eframe"]

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, optional = true, features = [
    "default_fonts",
    "glow",
    "persistence",
] }

# eframe SANS les features desktop/accesskit quand on build Android
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.2", default-features = false, optional = true, features = [
    "default_fonts",
    "android-native-activity",
    "glow",
    "persistence",
] }
android-activity = { version = "0.6", features = ["native-activity"] }
